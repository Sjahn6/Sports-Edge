; Copy this file to config.ini and fill in your key.

[general]
; leagues to run, comma separated
leagues = nfl,nba,nhl
timezone = America/Detroit
database = sportsedge.db
report = report.html

[odds]
; where sportsbook lines come from:
;   espn          free, no key. One sportsbook's spread, total and moneyline (ESPN's partner book).
;   espn,oddsapi  also pull every US book from The Odds API to shop prices.
;                 Needs a free key from https://the-odds-api.com (500 credits a month,
;                 each pull uses 3).
source = espn
api_key =
regions = us
; leave blank for every US book, or list the ones you use, for example:
; bookmakers = draftkings,fanduel,betmgm,williamhill_us,betrivers
bookmakers =
markets = spreads,totals,h2h

[model]
; how much to lean on the market line when building the expected score.
; 0 = pure model, 1 = pure market. 0.3 keeps the model from chasing
; injury news it can't see.
market_blend = 0.3
; only flag bets with at least this expected return per dollar (0.02 = 2%)
min_ev = 0.02
; stake suggestion as a fraction of full Kelly (0.25 = quarter Kelly)
kelly_fraction = 0.25
; how many past seasons to load as the preseason starting point
seasons_back = 1

[targets]
; the price you like to bet at, and the moneyline range the -200 plays tab shows
price = -200
band_low = -260
band_high = -160

[injuries]
; pull ESPN's injury report on every update and move the projections for it
enabled = true
; points a starting QB is worth before scaling by how well he has played (0.5x to 1.6x)
qb_value = 3.5
; RB/WR/TE: this x their share of team scrimmage yards (30% share = about 1 pt)
skill_value = 3.5
; defenders: this x 3 x their share of team tackles and sacks
defense_value = 2.0
; offensive linemen, only when the injury is under 10 days old
ol_value = 0.3
; cap on the total injury hit for one NFL team
max_per_team = 8.0
; NBA: (player's share of team points + 1.2 rebounds + 1.5 assists, above 6%) x this, in points.
; A star with 25% of his team's production = about 4 points.
nba_value = 22
nba_max_per_team = 12
; NHL: skaters (share of team goals + assists, above 3%) x this, in goals. A top line
; star is worth about 0.25 goals. The starting goalie out costs nhl_goalie_value goals.
nhl_skater_value = 2.0
nhl_goalie_value = 0.25
nhl_max_per_team = 0.6
