# Runs SportsEdge on GitHub's servers and publishes the dashboard to GitHub Pages.
# Times are UTC. Detroit is UTC-4 in summer and fall, UTC-5 in winter.
name: Update dashboard

on:
  schedule:
    - cron: "17 13 * * *"     # about 9am Detroit: overnight scores, morning injuries and lines
    - cron: "47 15 * * 0"     # about 11:45am Detroit Sundays: before the 1pm NFL games
    - cron: "17 21 * * *"     # about 5pm Detroit: before NBA and NHL games, Sunday night football
    - cron: "47 22 * * *"     # about 6:45pm Detroit: final lines before 7pm puck drops and tips
  workflow_dispatch: {}       # "Run workflow" button for a manual update

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sportsedge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The saved history (games, stats, every line snapshot) lives on a "data" branch
      # so it survives between runs without cluttering the main code.
      - name: Load saved data
        run: |
          if git fetch --depth 1 origin data 2>/dev/null; then
            git show origin/data:sportsedge.db > sportsedge.db || true
          fi
          ls -la sportsedge.db 2>/dev/null || echo "First run: starting a new database"
          [ -f config.ini ] || cp config.example.ini config.ini

      - name: Update and build dashboard
        run: python run.py --no-open

      - name: Save data
        run: |
          mkdir -p /tmp/data && cp sportsedge.db /tmp/data/
          cd /tmp/data
          git init -q -b data
          git config user.name "sportsedge-bot"
          git config user.email "sportsedge-bot@users.noreply.github.com"
          git add sportsedge.db
          git commit -q -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data

      - name: Prepare page
        run: |
          mkdir -p site
          cp report.html site/index.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
